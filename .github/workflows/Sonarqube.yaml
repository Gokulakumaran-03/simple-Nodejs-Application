name: Sonarqube pipeline

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: [wsl-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sonarqube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=nodeapp
            -Dsonar.sources=.
            -Dsonar.host.url=http://localhost:9000
            -Dsonar.token=sqp_56d4cb768fe8b3792a8551ad9dcb24c507d9d111
