name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  docker:
    runs-on: ["wsl-linux"]

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f dockerfile.distroless -t distroless .

      - name: Tag Docker image
        run: |
          SHA=${GITHUB_SHA::7}
          echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker tag distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHA

      - name: push to Dockerhub
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$SHA
